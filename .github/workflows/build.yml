name: Build Citizen Madani
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read

# Push and pull-request events for the same branch share one CI slot.
concurrency:
  group: citizen-madani-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run migration security regression tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizen-madani-web
          path: dist/
          if-no-files-found: error

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply all migrations from a clean database
        run: supabase db reset
      - name: Lint local PostgreSQL schema
        run: supabase db lint --fail-on error
      - name: Check local database security advisors
        run: supabase db advisors --type security --fail-on error
      - name: Run PostgreSQL integration tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo 'Supabase CLI was not installed; skipping local stack cleanup.'
          fi
